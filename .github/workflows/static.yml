name: Validate static website

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "static-site-validation"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify publishable files
        shell: bash
        run: |
          test -s index.html
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "tri2max.app"
